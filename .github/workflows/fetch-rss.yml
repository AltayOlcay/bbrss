name: Fetch RSS Data

#on:
#  workflow_dispatch:  # Sadece manuel tetikleme
on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir çalıştır (00:00, 06:00, 12:00, 18:00)
  workflow_dispatch:  # Manuel tetikleme de kalsın

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run RSS fetcher
        run: |
          python fetch_rss.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Yeni oluşan CSV dosyasını bul ve ekle
          git add *_BBRssToCsv.csv
          git add summary.json
          
          # Eğer değişiklik varsa commit et
          git diff --staged --quiet || git commit -m "🔄 RSS verileri güncellendi: $(date '+%Y-%m-%d %H:%M')"
          
          # Push et
          git push || echo "Değişiklik yok veya push hatası"
